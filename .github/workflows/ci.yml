name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14-dev"]

    steps:
    - uses: actions/checkout@v4
      env:
        ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      env:
        ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true

    - name: Install system dependencies for PyQt6
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1 libegl1 libxrandr2 libxss1 libxcursor1 libxcomposite1 libasound2t64 libxi6 libxtst6 qt6-base-dev qt6-wayland

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install uv
        uv pip install --system -e ".[dev]"
        pip install pytest pytest-cov pytest-qt pytest-mock hypothesis ruff pyright types-requests types-boto3 mdformat pre-commit

    - name: Lint with Ruff
      run: |
        ruff check .

    - name: Type check with Pyright
      run: |
        uv run pyright

    - name: Check Markdown formatting
      run: |
        mdformat --check .

    - name: Run tests with coverage
      run: |
        xvfb-run -a pytest
