name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.6"
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv pip install tox
      - name: Run Tests
        run: uv run tox -e py$(echo ${{ matrix.python-version }} | tr -d .)

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.6"
      - name: Install dependencies
        run: uv venv && source .venv/bin/activate && uv pip install -e .[dev]
      - name: Run pre-commit
        run: source .venv/bin/activate && pre-commit run --all-files
      - name: Run pyright
        run: source .venv/bin/activate && uv run pyright
