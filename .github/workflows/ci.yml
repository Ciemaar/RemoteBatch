name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.6"
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv tool install tox
      - name: Install Qt dependencies
        run: sudo apt-get update && sudo apt-get install -y libxcb-cursor0 libxkbcommon-x11-0 x11-utils xvfb libegl1 libgl1
      - name: Run Tests
        run: xvfb-run tox -e py$(echo ${{ matrix.python-version }} | tr -d .)
        env:
          QT_QPA_PLATFORM: offscreen

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.6"
      - name: Install dependencies
        run: uv venv && source .venv/bin/activate && uv pip install -e .[dev]
      - name: Run pre-commit
        run: source .venv/bin/activate && pre-commit run --all-files
      - name: Run pyright
        run: source .venv/bin/activate && uv run pyright
