[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "remotebatch"
version = "0.1.0"
description = "A modern Python 3.12+ application for delegating work from one machine to another."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PyQt6>=6.8.0",
    "boto3>=1.34.0",
    "requests>=2.31.0",
    "pydantic-settings>=2.2.0",
    "click>=8.1.0",
]

[project.scripts]
remotebatch = "remotebatch.RemoteBatch:main"
batchmanager = "remotebatch.BatchManager:main"
batchserver = "remotebatch.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-qt>=4.4.0",
    "pytest-mock>=3.12.0",
    "hypothesis>=6.98.0",
    "ruff>=0.3.0",
    "pyright>=1.1.350",
    "types-requests>=2.31.0",
    "types-boto3>=1.0.2",
    "mdformat>=0.7.17",
    "pre-commit>=3.6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP", "A", "C4", "SIM", "PLC", "PLE", "PLR", "PLW", "D"]
ignore = ["UP031", "D203", "D213"] # Ignore UP031, and some subjective pydocstyle rules like 1 blank line before class docstring

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pyright]
pythonVersion = "3.12"
venvPath = "."
venv = "env"
typeCheckingMode = "basic"
useLibraryCodeForTypes = true
reportMissingImports = false
include = ["src", "tests"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --cov=src/remotebatch --cov-report=xml --cov-report=term-missing"
testpaths = [
    "tests",
]
python_files = "*_test.py test_*.py"
pythonpath = "src"

[tool.coverage.run]
source = ["src/remotebatch"]
omit = [
    "setup.py",
    ".env/*",
    "env/*",
    "venv/*",
]

[tool.coverage.report]
fail_under = 35
show_missing = true
