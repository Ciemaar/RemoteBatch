[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP", "A", "C4", "SIM", "PLC", "PLE", "PLR", "PLW"]
ignore = ["UP031"]

[tool.pyright]
pythonVersion = "3.12"
venvPath = "."
venv = "env"
typeCheckingMode = "basic"
useLibraryCodeForTypes = true
reportMissingImports = false

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
python_files = "*_test.py test_*.py"
pythonpath = "."
