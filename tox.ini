[tox]
envlist = py314, py313, py312
isolated_build = True

[testenv]
deps =
    pytest
    pytest-cov
    pytest-qt
    pytest-mock
    hypothesis
    types-requests
    types-boto3
passenv =
    QT_QPA_PLATFORM
commands =
    pytest tests/test_model.py tests/test_properties.py tests/test_queues.py tests/test_server.py tests/test_cli.py --cov={envsitepackagesdir}/remotebatch --cov-report=xml --cov-report=term-missing --cov-fail-under=0
    pytest tests/test_view.py tests/test_tabdialog.py --cov={envsitepackagesdir}/remotebatch --cov-append --cov-report=xml --cov-report=term-missing --cov-fail-under=0
